<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div class="activity-controls" role="search" aria-label="Find activities">
          <div class="form-group">
            <label for="activity-search">Search</label>
            <input type="search" id="activity-search" placeholder="Name, description, or schedule" />
          </div>
          <div class="form-group">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sort-by">Sort by</label>
            <select id="sort-by">
              <option value="name">Name (A-Z)</option>
              <option value="schedule">Schedule (day and time)</option>
            </select>
          </div>
        </div>
        <p id="activity-count" aria-live="polite"></p>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
